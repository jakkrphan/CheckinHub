services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: checkinhub
      MYSQL_USER: ${SERVICE_LOWERCASEUSER_MYSQL}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_64_MYSQL}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MYSQL_ROOT}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${SERVICE_LOWERCASEUSER_MYSQL}:${SERVICE_PASSWORD_64_MYSQL}@mysql:3306/checkinhub
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mysql://${SERVICE_LOWERCASEUSER_MYSQL}:${SERVICE_PASSWORD_64_MYSQL}@mysql:3306/checkinhub
      AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      AUTH_TRUST_HOST: "true"
      APP_BASE_URL: ${APP_BASE_URL:-https://checkinhub.tech}
      UPLOAD_DIR: /app/uploads
      CRON_SECRET: ${SERVICE_PASSWORD_64_CRON}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_SEARCH_FILTER: ${LDAP_SEARCH_FILTER:-}
      LDAP_REQUIRED_OU: ${LDAP_REQUIRED_OU:-}
      LDAP_AUTO_PROVISION: ${LDAP_AUTO_PROVISION:-false}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
      LDAP_TLS_CA_FILE: ${LDAP_TLS_CA_FILE:-}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      LDAP_TIMEOUT: ${LDAP_TIMEOUT:-5000}
      LDAP_CONNECT_TIMEOUT: ${LDAP_CONNECT_TIMEOUT:-5000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_MESSAGING_CHANNEL_ID: ${LINE_MESSAGING_CHANNEL_ID:-}
      LINE_MESSAGING_CHANNEL_SECRET: ${LINE_MESSAGING_CHANNEL_SECRET:-}
      LINE_MESSAGING_ACCESS_TOKEN: ${LINE_MESSAGING_ACCESS_TOKEN:-}
      FEATURE_KIOSK: ${FEATURE_KIOSK:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
  uploads:
