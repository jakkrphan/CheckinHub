<!doctype html>

<body>
<div class="screen-mobile" style=" box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-body); ">

    <div style="font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1.35;">อบรมการใช้งานระบบ ePHIS สำหรับพยาบาลใหม่ รุ่นที่ 3</div>

    <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="font-weight: 600;">ขั้นที่ 3/3 · รับ QR + ยินยอม</span><span style="color: var(--muted);">ปิดรับ 10 ต.ค. 23:59</span></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px;">
    <label style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 12px; background: var(--surface); border: 2px solid var(--accent);">
      <span style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 700;">อีเมล</span><span style="font-size: 13px; color: var(--muted);">รับ QR เป็นไฟล์แนบ</span></span>
        <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: var(--accent);">
      </span>
      <input type="email" aria-label="อีเมล" value="kanokwan.s@gmail.com" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--input-border); border-radius: 10px; font-family: inherit; font-size: 16px;">
    </label>
    <label style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);">
      <span style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: var(--line-green); display: flex; align-items: center; justify-content: center; color: var(--surface); font-size: 11px; font-weight: 800;">LINE</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 700;">LINE</span><span style="font-size: 13px; color: var(--muted);">สำหรับคนไม่มี/ไม่สะดวกเช็คอีเมล</span></span>
        <input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: var(--accent);">
      </span>
      <button type="button" style="height: 46px; border: 0; border-radius: 10px; background: var(--line-green); color: var(--surface); font-family: inherit; font-size: 15px; font-weight: 700;">เข้าสู่ระบบด้วย LINE</button>
    </label>
    <label style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);">
      <input type="checkbox" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent);">
      <span style="font-size: 13px; line-height: 1.6;">ข้าพเจ้ายินยอมให้โรงพยาบาลเก็บและใช้ข้อมูลส่วนบุคคลนี้เพื่อการจัดอบรมและออกวุฒิบัตร ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล <a href="#pdpa">อ่านรายละเอียด</a> <span style="color: var(--danger);">*</span></span>
    </label>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);">
      <span style="width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 600;">ยืนยันว่าไม่ใช่บอท</span><span style="font-size: 12px; color: var(--muted);">ตรวจสอบแล้ว · Cloudflare Turnstile</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6Z"></path><path d="M9 12l2 2 4-4"></path></svg>

    <div style="font-size: 12px; color: var(--muted); text-align: center;">โครงการนี้อนุมัติเอง — จะได้ QR เมื่อผู้จัดอนุมัติ</div>
  </div>
